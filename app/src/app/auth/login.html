<div class="login-container">
  <!-- Si hay usuario, mostrar su info -->
  <ng-container *ngIf="user$ | async as u; else loginBtn">
    <img [src]="u.photoURL || ''" class="avatar" alt="Foto" />
    <h3>{{ u.displayName }}</h3>
    <p>{{ u.email }}</p>
    <small>Rol: {{ u.role }}</small>

    <button class="btn logout" (click)="logout()">Cerrar sesión</button>
  </ng-container>

  <!-- Si NO hay usuario, mostrar botón de login -->
  <ng-template #loginBtn>
    <button class="btn login" (click)="login()">
      Iniciar sesión con Google
    </button>
  </ng-template>
</div>
