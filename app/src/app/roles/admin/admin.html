<div class="admin-container">
  <header>
    <h1>Panel de Administrador</h1>
    <button (click)="auth.logout()" class="logout-btn">Cerrar Sesión</button>
  </header>

  <div class="users-list">
    <div class="list-header">
      <h3>Gestión de Usuarios</h3>
      <button class="btn-create" (click)="openCreateModal()">
        + Registrar Programador
      </button>
    </div>

    <table>
      <thead>
      <tr>
        <th>Usuario</th>
        <th>Email</th>
        <th>Rol Actual</th>
        <th>Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let u of users$ | async">
        <td>
          <div class="user-info">
            <img [src]="u.photoURL || 'https://ui-avatars.com/api/?name='+u.displayName" class="avatar">
            <span>{{ u.displayName }}</span>
          </div>
        </td>
        <td>{{ u.email }}</td>
        <td>
          <select [value]="u.role" (change)="updateRole(u.uid, $event)">
            <option value="user">User (Público)</option>
            <option value="programmer">Programmer</option>
            <option value="admin">Admin</option>
          </select>
        </td>
        <td>
          <div class="action-buttons">
            <button *ngIf="u.role !== 'user'" class="btn-icon btn-edit" (click)="editUser(u)" title="Editar Perfil">
              ✏️
            </button>
            <button class="btn-icon btn-delete" (click)="deleteUser(u)" title="Eliminar">
              🗑️
            </button>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="modal-overlay" *ngIf="isModalOpen && selectedUser">
    <div class="modal-content">
      <div class="modal-header">
        <h3>{{ isNewUser ? 'Registrar Programador' : 'Editar Perfil' }}</h3>
        <button class="close-btn" (click)="closeModal()">×</button>
      </div>

      <div class="modal-body">

        <label>Nombre Completo:</label>
        <input [(ngModel)]="selectedUser.displayName" placeholder="Ej: Gabriel Cordova">

        <label>Correo (Login):</label>
        <input [(ngModel)]="selectedUser.email" placeholder="correo@gmail.com" [disabled]="!isNewUser">

        <div class="section-title">Perfil Profesional</div>

        <label>Especialidad:</label>
        <input [(ngModel)]="selectedUser.specialty" placeholder="Ej: Full Stack Developer">

        <label>Descripción:</label>
        <textarea [(ngModel)]="selectedUser.description" placeholder="Resumen breve..."></textarea>

        <label>WhatsApp:</label>
        <input [(ngModel)]="selectedUser.whatsapp" placeholder="+593 99...">

        <label>GitHub:</label>
        <input [(ngModel)]="selectedUser.github" placeholder="URL GitHub">

        <div class="section-title" style="margin-top: 1.5rem;">
          📅 Horarios de Disponibilidad
        </div>

        <div class="schedule-input-group">
          <input [(ngModel)]="newScheduleInput"
                 placeholder="Ej: Lunes 14:00 - 16:00"
                 (keyup.enter)="addSchedule()">
          <button class="btn-add" (click)="addSchedule()">Agregar</button>
        </div>

        <div class="tags-container">
          <div class="tag-pill" *ngFor="let slot of selectedUser.availability; let i = index">
            <span>{{ slot }}</span>
            <button (click)="removeSchedule(i)">×</button>
          </div>
          <p *ngIf="!selectedUser.availability?.length" style="color:#999; font-size:0.8rem; font-style:italic;">
            Sin horarios definidos.
          </p>
        </div>

      </div>

      <div class="modal-footer">
        <button class="cancel" (click)="closeModal()">Cancelar</button>
        <button class="confirm" (click)="saveUserChanges()">Guardar Cambios</button>
      </div>
    </div>
  </div>
</div>
