<div class="programmer-layout">
  <aside class="sidebar">
    <div class="profile">
      <h3>Mi Panel</h3>
      <p>Programador</p>
    </div>
    <nav>
      <button class="active">Mis Proyectos</button>
      <button>Asesorías (Pendientes)</button>
      <button (click)="auth.logout()" class="logout">Cerrar Sesión</button>
    </nav>
  </aside>

  <main class="content">
    <header>
      <h2>Gestión de Portafolio</h2>
    </header>

    <div class="add-project-card">
      <h3>Nuevo Proyecto</h3>
      <div class="form-grid">
        <input type="text" [(ngModel)]="newProject.title" placeholder="Título del proyecto">
        <input type="text" [(ngModel)]="newProject.tech" placeholder="Tecnologías (ej: Angular, Firebase)">
        <input type="text" [(ngModel)]="newProject.link" placeholder="Enlace al repo/demo">
        <textarea [(ngModel)]="newProject.description" placeholder="Descripción breve"></textarea>
        <button (click)="addProject()">+ Agregar al Portafolio</button>
      </div>
    </div>

    <div class="projects-list">
      <h3>Mis Proyectos Publicados</h3>
      <div class="project-item" *ngFor="let proj of myProjects">
        <div>
          <h4>{{ proj.title }}</h4>
          <p>{{ proj.description }}</p>
          <small class="tech">{{ proj.tech }}</small>
        </div>
        <a [href]="proj.link" target="_blank" class="link-btn">Ver</a>
      </div>
    </div>
  </main>
</div>
